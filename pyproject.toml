[project]
name = "contentai"
version = "0.3.0"
description = "Open-ended conversational agent built with FastAPI, Vue3, LangChain and LangGraph."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.0",
  "celery[redis]>=5.4.0",
  "psycopg2-binary>=2.9.10",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "langchain>=1.3.0",
  "langchain-anthropic>=1.4.0",
  "langchain-openai>=1.3.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint-postgres>=3.0.0",
  "pydantic-settings>=2.4.0",
  "email-validator>=2.2.0",
  "pwdlib[argon2]>=0.2.1",
  "psycopg[binary,pool]>=3.2.0",
  "python-dotenv>=1.0.1",
  "redis>=5.2.0",
  "sqlmodel>=0.0.22",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "apps/api/src/agent",
  "apps/api/src/api",
  "apps/api/src/core",
  "apps/api/src/db",
  "apps/api/src/integrations",
  "apps/api/src/models",
  "apps/api/src/services"
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api/src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
