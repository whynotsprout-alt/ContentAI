[project]
name = "contentai"
version = "0.7.1"
description = "Content creation agent with source research, durable execution and review workflows."
requires-python = ">=3.12"
dependencies = [
  "alembic==1.18.4",
  "celery[redis]==5.6.3",
  "cryptography==46.0.3",
  "psycopg2-binary==2.9.12",
  "fastapi==0.137.1",
  "httpx==0.28.1",
  "langchain==1.3.11",
  "langchain-openai==1.3.3",
  "langgraph==1.2.7",
  "langgraph-checkpoint-postgres==3.1.0",
  "pydantic-settings==2.12.0",
  "email-validator==2.3.0",
  "pwdlib[argon2]==0.3.0",
  "psycopg[binary,pool]==3.3.4",
  "python-dotenv==1.1.0",
  "redis==6.4.0",
  "sqlmodel==0.0.38",
  "uvicorn[standard]==0.49.0"
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.12.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "apps/api/src/contentai"
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api/src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"apps/api/src/contentai/migrations/versions/*.py" = ["E501", "UP007", "UP035"]
