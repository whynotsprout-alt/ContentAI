x-api-build: &api-build
  context: .
  dockerfile: infra/Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contentai
      POSTGRES_USER: contentai
      POSTGRES_PASSWORD: contentai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentai -d contentai"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  migration:
    build: *api-build
    command: python -m services.migrate
    env_file: .env
    environment:
      CONTENTAI_DATABASE__URL: postgresql+psycopg://contentai:contentai@postgres:5432/contentai
      CONTENTAI_REDIS__URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *api-build
    env_file: .env
    environment:
      CONTENTAI_DATABASE__URL: postgresql+psycopg://contentai:contentai@postgres:5432/contentai
      CONTENTAI_REDIS__URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12

  dispatcher:
    build: *api-build
    command: python -m services.dispatcher
    env_file: .env
    environment:
      CONTENTAI_DATABASE__URL: postgresql+psycopg://contentai:contentai@postgres:5432/contentai
      CONTENTAI_REDIS__URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 3s
      retries: 5

  agent-worker:
    build: *api-build
    command: python -m celery -A services.celery_app:celery_app worker --loglevel=INFO --queues=agent-executions --hostname=agent@%h
    env_file: .env
    environment:
      CONTENTAI_DATABASE__URL: postgresql+psycopg://contentai:contentai@postgres:5432/contentai
      CONTENTAI_REDIS__URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    stop_grace_period: 35m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -m celery -A services.celery_app:celery_app inspect ping -d agent@$$HOSTNAME --timeout=3"]
      interval: 15s
      timeout: 5s
      retries: 5

  background-worker:
    build: *api-build
    command: python -m celery -A services.celery_app:celery_app worker --loglevel=INFO --queues=agent-background --concurrency=2 --hostname=background@%h
    env_file: .env
    environment:
      CONTENTAI_DATABASE__URL: postgresql+psycopg://contentai:contentai@postgres:5432/contentai
      CONTENTAI_REDIS__URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    stop_grace_period: 10m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -m celery -A services.celery_app:celery_app inspect ping -d background@$$HOSTNAME --timeout=3"]
      interval: 15s
      timeout: 5s
      retries: 5

  beat:
    build: *api-build
    command: python -m celery -A services.celery_app:celery_app beat --loglevel=INFO --schedule=/tmp/contentai-celerybeat-schedule
    env_file: .env
    environment:
      CONTENTAI_DATABASE__URL: postgresql+psycopg://contentai:contentai@postgres:5432/contentai
      CONTENTAI_REDIS__URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 15s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5180:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
  redis-data:
