services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  migration:
    environment:
      CONTENTAI_ENV: development

  api:
    environment:
      CONTENTAI_ENV: development
    ports:
      - "${CONTENTAI_LAN_BIND_HOST:-0.0.0.0}:${API_PORT:-8000}:8000"

  dispatcher:
    environment:
      CONTENTAI_ENV: development

  agent-worker:
    environment:
      CONTENTAI_ENV: development

  background-worker:
    environment:
      CONTENTAI_ENV: development

  beat:
    environment:
      CONTENTAI_ENV: development
